name: dependency updates
on:
  schedule:
    # Monday at 06:00 in Asia/Tokyo.
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "username=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "author=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          RENOVATE_VERSION: 44.239.1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USERNAME: ${{ steps.bot.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BINARY_SOURCE: install
          # Only this repository's deterministic bundle generator may run after an update.
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/sync-upstreams[.]py$"]'
